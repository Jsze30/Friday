[project]
name = "friday-agent"
version = "0.1.0"
description = "Friday voice assistant - LiveKit Cloud agent"
requires-python = ">=3.11"
dependencies = [
    "livekit-agents[deepgram,anthropic,openai,silero]~=1.2",
    "python-dotenv>=1.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.9",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
