<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="background" x1="160" y1="112" x2="864" y2="912" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#090d14"/>
      <stop offset="0.52" stop-color="#02050a"/>
      <stop offset="1" stop-color="#000105"/>
    </linearGradient>
    <linearGradient id="ring" x1="210" y1="210" x2="812" y2="820" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#29e8ff" stop-opacity="0.38"/>
      <stop offset="0.30" stop-color="#29e8ff"/>
      <stop offset="0.52" stop-color="#efffff"/>
      <stop offset="0.72" stop-color="#388aff"/>
      <stop offset="1" stop-color="#29e8ff" stop-opacity="0.45"/>
    </linearGradient>
    <radialGradient id="bloom" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#29e8ff" stop-opacity="0.22"/>
      <stop offset="0.42" stop-color="#388aff" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#29e8ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="core" cx="42%" cy="38%" r="62%">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.30" stop-color="#d9feff"/>
      <stop offset="0.62" stop-color="#29e8ff"/>
      <stop offset="1" stop-color="#388aff" stop-opacity="0"/>
    </radialGradient>
    <filter id="ringGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="coreGlow" x="-180%" y="-180%" width="460%" height="460%">
      <feGaussianBlur stdDeviation="20" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <clipPath id="squircle">
      <rect x="64" y="64" width="896" height="896" rx="202"/>
    </clipPath>
  </defs>

  <g clip-path="url(#squircle)">
    <rect x="64" y="64" width="896" height="896" rx="202" fill="url(#background)"/>
    <circle cx="512" cy="512" r="392" fill="url(#bloom)"/>

    <g fill="none" stroke-linecap="round" filter="url(#ringGlow)">
      <circle cx="512" cy="512" r="322" stroke="#29e8ff" stroke-opacity="0.19" stroke-width="28" stroke-dasharray="1695 328" transform="rotate(-78 512 512)"/>
      <circle cx="512" cy="512" r="272" stroke="#29e8ff" stroke-opacity="0.22" stroke-width="26" stroke-dasharray="1438 271" transform="rotate(44 512 512)"/>
      <circle cx="512" cy="512" r="222" stroke="#29e8ff" stroke-opacity="0.25" stroke-width="24" stroke-dasharray="1165 230" transform="rotate(-126 512 512)"/>
      <circle cx="512" cy="512" r="172" stroke="#29e8ff" stroke-opacity="0.28" stroke-width="22" stroke-dasharray="891 190" transform="rotate(20 512 512)"/>
      <circle cx="512" cy="512" r="122" stroke="#29e8ff" stroke-opacity="0.31" stroke-width="20" stroke-dasharray="616 151" transform="rotate(-101 512 512)"/>
    </g>

    <g fill="none" stroke="url(#ring)" stroke-linecap="round">
      <circle cx="512" cy="512" r="322" stroke-width="11" stroke-dasharray="1695 328" transform="rotate(-78 512 512)"/>
      <circle cx="512" cy="512" r="272" stroke-width="11" stroke-dasharray="1438 271" transform="rotate(44 512 512)"/>
      <circle cx="512" cy="512" r="222" stroke-width="12" stroke-dasharray="1165 230" transform="rotate(-126 512 512)"/>
      <circle cx="512" cy="512" r="172" stroke-width="13" stroke-dasharray="891 190" transform="rotate(20 512 512)"/>
      <circle cx="512" cy="512" r="122" stroke-width="14" stroke-dasharray="616 151" transform="rotate(-101 512 512)"/>
    </g>

    <g fill="#f4ffff" filter="url(#coreGlow)">
      <circle cx="602" cy="203" r="8"/>
      <circle cx="764" cy="680" r="8"/>
      <circle cx="579" cy="778" r="8"/>
      <circle cx="368" cy="630" r="8"/>
      <circle cx="612" cy="415" r="9"/>
    </g>

    <circle cx="512" cy="512" r="43" fill="#29e8ff" opacity="0.22" filter="url(#coreGlow)"/>
    <circle cx="512" cy="512" r="28" fill="url(#core)" filter="url(#coreGlow)"/>
    <circle cx="501" cy="501" r="7" fill="#ffffff"/>
  </g>

  <rect x="68" y="68" width="888" height="888" rx="198" fill="none" stroke="#29e8ff" stroke-opacity="0.10" stroke-width="8"/>
</svg>
