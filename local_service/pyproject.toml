[project]
name = "friday-local-service"
version = "0.1.0"
description = "Friday local helper - LiveKit token signing, tool registry, local events API"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "livekit-api>=0.8",
    "keyring>=25.6",
    "numpy>=1.26",
    "openwakeword>=0.6.0",
    "python-dotenv>=1.0",
]

# sounddevice is only used by scripts/wake_monitor.py for validating candidate
# wake models against the raw microphone.
[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.9",
    "sounddevice>=0.5",
]

[tool.uv]
package = false
